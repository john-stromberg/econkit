# Series registry for the econkit data layer.
#
# id:                  econkit series id; also the column name returned by ek_get_series().
# source:              provider adapter ("fred"). FRED series also support ALFRED vintages.
# source_id:           identifier at the provider.
# frequency:           native frequency: daily, weekly, monthly or quarterly.
# aggregation:         rule for converting to a lower frequency: mean, last, sum or max.
# seasonal_adjustment: SA, NSA or "not applicable".
# release_lag_days:    conservative days after the end of the native observation period
#                      before a value is published. Used only by the release-lag
#                      approximation of point-in-time data; it does not model revisions.
# license:             redistribution notes. Check provider terms before redistributing.
# in_sample:           whether the bundled synthetic macro_monthly dataset contains the
#                      series. ek_get_series(ids = NULL) returns these series.
# transform:           suggested default transformation (see ek_transform()).
series:
  - id: USREC
    title: NBER-based recession indicator
    units: "1 = recession, 0 = expansion"
    frequency: monthly
    category: cycle
    transform: level
    source: fred
    source_id: USREC
    aggregation: max
    seasonal_adjustment: not applicable
    release_lag_days: 365
    license: public (FRED/NBER); cite source
    in_sample: true
  - id: T10Y3M
    title: 10-year Treasury minus 3-month Treasury bill
    units: percentage points
    frequency: daily
    category: rates
    transform: level
    source: fred
    source_id: T10Y3M
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Board)
    in_sample: true
  - id: DGS10
    title: 10-year Treasury constant maturity yield
    units: percent
    frequency: daily
    category: rates
    transform: level
    source: fred
    source_id: DGS10
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Board)
    in_sample: true
  - id: DGS3MO
    title: 3-month Treasury constant maturity yield
    units: percent
    frequency: daily
    category: rates
    transform: level
    source: fred
    source_id: DGS3MO
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Board)
    in_sample: true
  - id: DGS5
    title: 5-year Treasury constant maturity yield
    units: percent
    frequency: daily
    category: rates
    transform: level
    source: fred
    source_id: DGS5
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Board)
    in_sample: true
  - id: DGS30
    title: 30-year Treasury constant maturity yield
    units: percent
    frequency: daily
    category: rates
    transform: level
    source: fred
    source_id: DGS30
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Board)
    in_sample: true
  - id: TB3MS
    title: 3-month Treasury bill secondary market rate
    units: percent
    frequency: monthly
    category: rates
    transform: level
    source: fred
    source_id: TB3MS
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Board)
    in_sample: true
  - id: FEDFUNDS
    title: Effective federal funds rate
    units: percent
    frequency: monthly
    category: rates
    transform: level
    source: fred
    source_id: FEDFUNDS
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: public (Federal Reserve Bank of New York)
    in_sample: true
  - id: UNRATE
    title: Unemployment rate
    units: percent
    frequency: monthly
    category: labor
    transform: level
    source: fred
    source_id: UNRATE
    aggregation: mean
    seasonal_adjustment: SA
    release_lag_days: 10
    license: public (BLS)
    in_sample: true
  - id: PAYEMS
    title: Total nonfarm payrolls
    units: thousands of persons
    frequency: monthly
    category: labor
    transform: yoy
    source: fred
    source_id: PAYEMS
    aggregation: last
    seasonal_adjustment: SA
    release_lag_days: 10
    license: public (BLS)
    in_sample: true
  - id: INDPRO
    title: Industrial production index
    units: index
    frequency: monthly
    category: activity
    transform: yoy
    source: fred
    source_id: INDPRO
    aggregation: mean
    seasonal_adjustment: SA
    release_lag_days: 20
    license: public (Federal Reserve Board)
    in_sample: true
  - id: CPIAUCSL
    title: Consumer price index, all urban consumers
    units: index
    frequency: monthly
    category: prices
    transform: yoy
    source: fred
    source_id: CPIAUCSL
    aggregation: mean
    seasonal_adjustment: SA
    release_lag_days: 20
    license: public (BLS)
    in_sample: true
  - id: PCEPILFE
    title: Core PCE price index
    units: index
    frequency: monthly
    category: prices
    transform: yoy
    source: fred
    source_id: PCEPILFE
    aggregation: mean
    seasonal_adjustment: SA
    release_lag_days: 35
    license: public (BEA)
    in_sample: true
  - id: NFCI
    title: Chicago Fed National Financial Conditions Index
    units: index (positive = tighter than average)
    frequency: weekly
    category: financial
    transform: level
    source: fred
    source_id: NFCI
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 7
    license: public (Federal Reserve Bank of Chicago); cite source
    in_sample: true
  - id: DGS2
    title: 2-year Treasury constant maturity yield
    units: percent
    frequency: daily
    category: rates
    transform: level
    source: fred
    source_id: DGS2
    aggregation: mean
    seasonal_adjustment: NSA
