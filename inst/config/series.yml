  - id: BAA10Y
    title: Moody's seasoned Baa corporate yield minus 10-year Treasury
    units: percentage points
    frequency: daily
    category: credit
    transform: level
    source: fred
    source_id: BAA10Y
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: Moody's via FRED; check terms before redistribution
    in_sample: false
  - id: VIXCLS
    title: Cboe Volatility Index (VIX)
    units: index
    frequency: daily
    category: markets
    transform: level
    source: fred
    source_id: VIXCLS
    aggregation: mean
    seasonal_adjustment: NSA
    release_lag_days: 1
    license: Cboe via FRED; check terms before redistribution
    in_sample: false
  - id: GDPC1
    title: Real gross domestic product
    units: billions of chained dollars, SAAR
    frequency: quarterly
    category: activity
    transform: annualized
    source: fred
    source_id: GDPC1
    aggregation: mean
    seasonal_adjustment: SA
